<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="价格计算" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f3f5" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111317" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230052d9'/%3E%3Ctext x='90' y='118' font-size='84' text-anchor='middle' fill='%23fff' font-family='system-ui'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E" />
<title>价格计算器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f2f3f5;
    --card: #ffffff;
    --border: #e4e7ec;
    --fg: #1c1f23;
    --fg2: #6b7280;
    --fg3: #9ca3af;
    --accent: #0052d9;
    --green: #2ba471;
    --red: #d54941;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317;
      --card: #1d1f23;
      --border: #2c2f36;
      --fg: #e8eaed;
      --fg2: #9aa1ac;
      --fg3: #6b7280;
      --accent: #4c8dff;
      --green: #3ec98f;
      --red: #f0685f;
    }
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
    font-family: -apple-system, "PingFang SC", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
  }
  header { display: flex; align-items: baseline; gap: 8px; padding: 4px 2px 14px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  header small { color: var(--fg3); font-size: 12px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 6px 14px;
    margin-bottom: 14px;
  }

  .field { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
  .field + .field { border-top: 1px solid var(--border); }
  .field label {
    flex-shrink: 0; width: 118px; font-size: 13px; color: var(--fg2);
  }
  .result-row input {
    flex: 1; min-width: 0; text-align: right;
    font-size: 16px; color: var(--fg);
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 10px;
    background: transparent; font-variant-numeric: tabular-nums;
  }
  .result-row input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  /* 字段区：输入框 + 右侧单位装饰段（对齐桌面版 InputAdornment 形态） */
  .input-group {
    flex: 1; min-width: 0;
    display: flex; align-items: stretch;
    border: 1px solid var(--border); border-radius: 10px;
    background: transparent;
  }
  .input-group:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .input-group input {
    flex: 1; min-width: 0; border: 0; outline: none;
    text-align: right; font-size: 16px; color: var(--fg);
    padding: 7px 10px; background: transparent; font-variant-numeric: tabular-nums;
  }
  .input-group .unit {
    flex-shrink: 0; display: flex; align-items: center;
    padding: 0 10px; font-size: 13px; color: var(--fg2);
    background: color-mix(in srgb, var(--fg) 5%, transparent);
    border-left: 1px solid var(--border);
  }
  /* 结果区金额：$ 前置紧贴数字 */
  .amount { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: flex-end; gap: 1px; }
  .amount input { flex: 0 1 110px; }
  .amount .cur { font-size: 16px; font-weight: 600; color: var(--fg); }
  .result-row--buyer .cur { color: var(--green); }

  .result-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
  .result-row + .result-row { border-top: 1px solid var(--border); }
  .result-row .rl { flex-shrink: 0; width: 118px; font-size: 13px; color: var(--fg2); }
  .result-row input { font-weight: 600; }
  .result-row .eur {
    flex: 1; text-align: right; font-size: 24px; font-weight: 700;
    color: var(--green); font-variant-numeric: tabular-nums;
  }
  .result-row--buyer input { color: var(--green); }

  .invalid {
    display: none; padding: 14px 0; font-size: 13px; line-height: 1.6; color: var(--red);
  }
  .invalid.show { display: block; }
  .rows.hidden { display: none; }

  .copy-btn {
    display: block; width: 100%; margin: 4px 0 2px;
    padding: 12px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .copy-btn:active { opacity: 0.8; }
  .copy-btn.done { background: var(--green); }

  .formulas {
    display: none; flex-direction: column; gap: 8px;
    margin-top: 12px;
  }
  .formulas.show { display: flex; }
  .formula {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: color-mix(in srgb, var(--fg) 4%, transparent);
  }
  .formula .fl {
    display: block; margin-bottom: 3px;
    font-size: 11px; color: var(--fg3);
  }
  .formula code {
    font-family: inherit;
    font-size: 13px; color: var(--fg);
    font-variant-numeric: tabular-nums;
    word-break: break-all; line-height: 1.5;
  }
</style>
</head>
<body>
<header>
  <h1>价格计算器</h1>
  <small>成本 → 收入 → 买家价</small>
</header>

<div class="card" id="fields"></div>

<div class="card">
  <div class="rows" id="rows">
    <div class="result-row">
      <span class="rl">预计收入</span>
      <span class="amount"><span class="cur">$</span><input inputmode="decimal" data-key="income" placeholder="0.00" title="输入预计收入（含买家运费），反推成本价与买家价格" /></span>
    </div>
    <div class="result-row result-row--buyer">
      <span class="rl">买家价格（美元）</span>
      <span class="amount"><span class="cur">$</span><input inputmode="decimal" data-key="buyer" placeholder="0.00" title="输入买家价格（含买家运费），反推成本价" /></span>
    </div>
    <div class="result-row">
      <span class="rl">买家价格（欧元+VAT）</span>
      <span class="eur" id="eur" title="买家价格换算欧元后额外加收欧盟税">€0.00</span>
    </div>
  </div>
  <p class="invalid" id="invalid">毛利率、佣金比例需小于 100%，汇率需大于 0，无法计算</p>
  <button class="copy-btn" id="copy" type="button">复制报价</button>
  <div class="formulas" id="formulas">
    <div class="formula">
      <span class="fl">预计收入</span>
      <code id="fc1"></code>
    </div>
    <div class="formula">
      <span class="fl">买家价格（美元）</span>
      <code id="fc2"></code>
    </div>
    <div class="formula">
      <span class="fl">买家价格（欧元+VAT）</span>
      <code id="fc3"></code>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'whats:price-inputs';
  var DEFAULTS = {
    cost: 0, buyer: 0, buyerEur: 0, income: 0, buyerShipping: 0,
    margin: 0, express: 0, intl: 0, commission: 0,
    usdRate: 6.7, eurRate: 1.11, vat: 21
  };
  var FIELDS = [
    { key: 'margin', label: '毛利率', unit: '%' },
    { key: 'cost', label: '成本货价', unit: '¥', title: '编辑买家价格或预计收入时自动反推' },
    { key: 'express', label: '成本快递', unit: '¥' },
    { key: 'intl', label: '成本物流', unit: '¥' },
    { key: 'buyerShipping', label: '买家运费', unit: '$', title: '买家额外支付的运费，计入买家价格、预计收入与 VAT 计税基数' },
    { key: 'commission', label: '佣金比例', unit: '%' },
    { key: 'usdRate', label: '美元汇率', unit: '¥', title: '1 美元 = ? 人民币，预计收入 = 人民币口径 ÷ 美元汇率 + 买家运费' },
    { key: 'eurRate', label: '欧元汇率', unit: '$', title: '1 欧元 = ? 美元，最终买家价(€) = 买家价($) ÷ 欧元汇率 ×（1+欧盟税率）' },
    { key: 'vat', label: '欧盟税率', unit: '%', title: '在买家价格之上额外征收，按目的地国家 17%~27%，如德国 19%、法国 20%' }
  ];

  var LEGACY_USD_RATE = 6.7; // 历史版本的固定美元汇率（迁移旧存储换算用）

  function loadValues() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      var v = {};
      for (var k in DEFAULTS) v[k] = DEFAULTS[k];
      for (var k2 in DEFAULTS) {
        if (typeof saved[k2] === 'number' && isFinite(saved[k2])) v[k2] = saved[k2];
      }
      if (saved.vat === 20) v.vat = 21; // 旧默认税 20 升级；用户自定义值不受影响
      // 上一版欧元汇率锚定人民币（1€=?¥，存储里尚无 usdRate 字段）：÷6.7 换算回美元口径（与桌面版一致）
      if (typeof saved.usdRate !== 'number' && typeof saved.eurRate === 'number' && isFinite(saved.eurRate) && saved.eurRate > 0) {
        v.eurRate = Math.round((saved.eurRate / LEGACY_USD_RATE) * 100) / 100;
      }
      // 更早版本字段名 eurUsd（1€=?$），语义相同，直接沿用
      if (typeof saved.eurUsd === 'number' && isFinite(saved.eurUsd) && saved.eurUsd > 0) {
        v.eurRate = saved.eurUsd;
      }
      return v;
    } catch (e) { return JSON.parse(JSON.stringify(DEFAULTS)); }
  }

  // 与桌面版一致：归一到货物人民币口径 R = 成本÷(1-毛利率)+快递费+国际运费，再分摊各端；
  // 预计收入 = 货物收入 + 买家运费；买家价 = 货物收入÷(1-佣金) + 买家运费（运费不加佣金加成）；VAT 基数含买家运费
  function recompute(next, anchor) {
    var md = 1 - next.margin / 100;
    var cd = 1 - next.commission / 100;
    if (md <= 0 || cd <= 0 || next.usdRate <= 0 || next.eurRate <= 0) return false;
    var vat = 1 + next.vat / 100;
    var r;
    if (anchor === 'cost') r = next.cost / md + next.express + next.intl;
    else if (anchor === 'buyer') r = (next.buyer - next.buyerShipping) * cd * next.usdRate;
    else r = (next.income - next.buyerShipping) * next.usdRate;
    if (!isFinite(r)) return false;
    if (anchor !== 'cost') next.cost = (r - next.express - next.intl) * md;
    if (anchor !== 'income') next.income = r / next.usdRate + next.buyerShipping;
    if (anchor !== 'buyer') next.buyer = r / next.usdRate / cd + next.buyerShipping;
    next.buyerEur = (next.buyer / next.eurRate) * vat;
    return true;
  }

  // 只留数字与一个小数点，小数位最多两位
  function cleanText(t) {
    var s = String(t).replace(/[^\d.]/g, '');
    var dot = s.indexOf('.');
    if (dot >= 0) {
      s = s.slice(0, dot + 1) + s.slice(dot + 1).replace(/\./g, '');
      s = s.replace(/^(\d+\.\d{0,2}).*$/, '$1');
    }
    return s;
  }

  var values = loadValues();
  var inputs = []; // { el, key }

  // 公式代入用的数值文本：去掉多余小数尾零（6.70→6.7、100.00→100）
  function trimNum(n) { return String(parseFloat(n.toFixed(2))); }

  function render() {
    var invalid =
      1 - values.margin / 100 <= 0 ||
      1 - values.commission / 100 <= 0 ||
      values.usdRate <= 0 ||
      values.eurRate <= 0;
    document.getElementById('rows').classList.toggle('hidden', invalid);
    document.getElementById('invalid').classList.toggle('show', invalid);
    document.getElementById('eur').textContent = '€' + values.buyerEur.toFixed(2);
    var formulas = document.getElementById('formulas');
    formulas.classList.toggle('show', !invalid);
    if (!invalid) {
      document.getElementById('fc1').textContent =
        '(' + trimNum(values.cost) + '÷(1−' + trimNum(values.margin) + '%)+' + trimNum(values.express) + '+' + trimNum(values.intl) + ')÷' + trimNum(values.usdRate) + '+' + trimNum(values.buyerShipping) + ' = ' + values.income.toFixed(2);
      document.getElementById('fc2').textContent =
        '(' + values.income.toFixed(2) + '−' + trimNum(values.buyerShipping) + ')÷(1−' + trimNum(values.commission) + '%)+' + trimNum(values.buyerShipping) + ' = ' + values.buyer.toFixed(2);
      document.getElementById('fc3').textContent =
        values.buyer.toFixed(2) + '÷' + trimNum(values.eurRate) + '×(1+' + trimNum(values.vat) + '%) = ' + values.buyerEur.toFixed(2);
    }
    for (var i = 0; i < inputs.length; i++) {
      var it = inputs[i];
      if (document.activeElement === it.el) continue; // 焦点中不回写，避免打断输入
      it.el.value = values[it.key].toFixed(2);
    }
  }

  function commit(key, parsed) {
    values[key] = parsed;
    recompute(values, key === 'buyer' || key === 'income' ? key : 'cost');
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(values)); } catch (e) {}
    render();
  }

  function bind(el, key) {
    inputs.push({ el: el, key: key });
    var original = ''; // 聚焦时的原始文本
    el.addEventListener('focus', function () {
      original = el.value;
    });
    el.addEventListener('input', function () {
      var cleaned = cleanText(el.value);
      if (cleaned !== el.value) el.value = cleaned;
      var parsed = parseFloat(cleaned);
      if (isFinite(parsed)) commit(key, parsed);
    });
    el.addEventListener('blur', function () {
      // 未修改时不触发换算：避免 focus+blur 用舍入后的展示值反推造成其他字段抖动
      if (el.value === original) return;
      var v = parseFloat(el.value);
      if (!isFinite(v)) v = 0;
      commit(key, v);
      el.value = v.toFixed(2);
    });
  }

  // 生成字段区：输入框 + 右侧单位装饰段
  var box = document.getElementById('fields');
  FIELDS.forEach(function (f) {
    var row = document.createElement('div');
    row.className = 'field';
    if (f.title) row.title = f.title;
    var label = document.createElement('label');
    label.textContent = f.label;
    var group = document.createElement('div');
    group.className = 'input-group';
    var input = document.createElement('input');
    input.inputMode = 'decimal';
    input.placeholder = '0.00';
    var unit = document.createElement('span');
    unit.className = 'unit';
    unit.textContent = f.unit || '';
    group.appendChild(input);
    group.appendChild(unit);
    row.appendChild(label);
    row.appendChild(group);
    box.appendChild(row);
    bind(input, f.key);
  });

  // 结果区的行内输入（反推）
  document.querySelectorAll('#rows input[data-key]').forEach(function (el) {
    bind(el, el.getAttribute('data-key'));
  });

  // 报价文案：动态取当前买家价（美元）与含税欧元价、当前欧盟税率
  function getQuoteText() {
    return (
      'The price of this item after discount (shipping included) is $' +
      values.buyer.toFixed(2) +
      ' USD.\n' +
      'Estimated price for EU countries (' +
      Math.round(values.vat) +
      '% VAT included): €' +
      values.buyerEur.toFixed(2) +
      ' EUR.\n' +
      'This is an estimated price.'
    );
  }

  var copyBtn = document.getElementById('copy');
  copyBtn.addEventListener('click', function () {
    var text = getQuoteText();
    copyBtn.title = text; // 悬停可预览全文
    var done = function () {
      copyBtn.textContent = '已复制 ✓';
      copyBtn.classList.add('done');
      setTimeout(function () {
        copyBtn.textContent = '复制报价';
        copyBtn.classList.remove('done');
      }, 1600);
    };
    var fail = function () { copyBtn.textContent = '复制失败，请长按手动复制'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done, fail); });
    } else {
      fallbackCopy(text, done, fail);
    }
  });
  function fallbackCopy(text, done, fail) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) done(); else fail();
    setTimeout(function () { copyBtn.textContent = '复制报价'; }, 2400);
  }

  render();
})();
</script>
</body>
</html>
